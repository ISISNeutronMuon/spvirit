[package]
name = "spvirit-tools"
version.workspace = true
edition = "2024"
description = "PVAccess client/server tools for EPICS"
license = "BSD-3-Clause"
repository = "https://github.com/ISISNeutronMuon/spvirit"
readme = "README.md"
keywords = ["epics", "pvaccess"]  
categories = ["science"]
authors = ["Mateusz Leputa for ISIS Neutron and Muon Source Copyright 2026"]

[features]
default = ["client", "server", "tui"]
client = []
server = []
tui = ["dep:ratatui", "dep:color-eyre"]
# Packet capture + analysis (`spvirit-scry`, `spvirit-scry_influx_collector`).
# Off by default: pcap links against the Npcap SDK (Windows) or libpcap
# (Linux), which neither the default build, CI nor the wheel should need.
scry = [
    "tui",
    "dep:pcap",
    "dep:colored",
    "dep:dns-lookup",
    "dep:gethostname",
    "dep:reqwest",
    "dep:toml",
    "dep:vergen-git2",
]
# The internal gateway load generator (`spload`), used by the loadtest/
# harness. Off by default so the pip wheel, which maturin builds from the
# default features, does not ship it: `cargo build -p spvirit-tools
# --features load --bin spload`.
load = ["client"]

[dependencies]
spvirit-types.workspace = true
spvirit-codec.workspace = true
spvirit-client.workspace = true
spvirit-server.workspace = true
spvirit-gateway.workspace = true

tokio = { version = "1.47.1", features = [
    "net",
    "io-util",
    "time",
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
regex = "1.11.2"
get_if_addrs = "0.5.3"
hex = "0.4.3"
socket2 = { version = "0.5", features = ["all"] }
argparse = "0.2.2"
ratatui = { version = "0.29.0", optional = true }
color-eyre = { version = "0.6.5", optional = true }

# scry-only
pcap = { version = "2.3.0", features = ["capture-stream"], optional = true }
colored = { version = "3.0.0", optional = true }
dns-lookup = { version = "3.0.0", optional = true }
gethostname = { version = "1.0.2", optional = true }
reqwest = { version = "0.12.23", features = ["json"], optional = true }
toml = { version = "0.8", optional = true }

[build-dependencies]
vergen-git2 = { version = "1.0.7", features = ["build", "rustc"], optional = true }

[dev-dependencies]
toml = "0.8"

[[bin]]
name = "spget"
path = "src/bin/spvirit_get.rs"
required-features = ["client"]

[[bin]]
name = "spmonitor"
path = "src/bin/spvirit_monitor.rs"
required-features = ["client"]

[[bin]]
name = "spput"
path = "src/bin/spvirit_put.rs"
required-features = ["client"]

[[bin]]
name = "spsine"
path = "src/bin/spvirit_sine.rs"
required-features = ["client"]

[[bin]]
name = "spinfo"
path = "src/bin/spvirit_info.rs"
required-features = ["client"]

[[bin]]
name = "spexplore"
path = "src/bin/spvirit_explore.rs"
required-features = ["client", "tui"]

[[bin]]
name = "splist"
path = "src/bin/spvirit_list.rs"
required-features = ["client"]

[[bin]]
name = "spserver"
path = "src/bin/spvirit_server.rs"
required-features = ["server"]

[[bin]]
name = "spdodeca"
path = "src/bin/spvirit_dodeca.rs"
required-features = ["server"]

[[bin]]
name = "spsearch"
path = "src/bin/spvirit_search.rs"
required-features = ["client", "tui"]

[[bin]]
name = "spget_compare"
path = "src/bin/spvirit_get_compare.rs"
required-features = ["client"]

[[bin]]
name = "sptable"
path = "src/bin/spvirit_table/main.rs"
required-features = ["server", "tui"]

[[bin]]
name = "spgateway"
path = "src/bin/spgateway.rs"
required-features = ["client", "server"]

[[bin]]
name = "spload"
path = "src/bin/spvirit_load.rs"
required-features = ["load"]

[[bin]]
name = "spvirit-scry"
path = "src/bin/spvirit_scry.rs"
required-features = ["scry"]

[[bin]]
name = "spvirit-scry_influx_collector"
path = "src/bin/spvirit_scry_influx_collector.rs"
required-features = ["scry"]
