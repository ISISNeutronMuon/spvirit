[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "spvirit-tools"
description = "Command-line tools for EPICS PVAccess: get, put, monitor, list, info, a terminal browser, a gateway and a packet-capture analyser."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Mateusz Leputa", email = "mateo.leputa@googlemail.com" },
]
requires-python = ">=3.9"
keywords = ["epics", "pvaccess", "ioc", "controls", "instrumentation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Hardware",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/ISISNeutronMuon/spvirit"
Issues = "https://github.com/ISISNeutronMuon/spvirit/issues"

[tool.maturin]
# Version comes from Cargo.toml, which inherits it from the workspace.
#
# `bindings = "bin"` is stated explicitly rather than left to auto-detection:
# maturin only infers it for a crate with a single binary target and no
# library, and this crate has a library plus sixteen binary targets (fifteen
# of them in the wheel). In this mode the binaries are packaged as wheel
# scripts, which pip installs into the environment's bin/Scripts directory --
# i.e. onto PATH.
#
# The build uses the crate's default features (client, server, tui) plus
# `scry`, so the wheel carries fifteen tools: the thirteen default ones and
# spvirit-scry + spvirit-scry_influx_collector
# (spvirit-tools/scripts/verify_wheel.py lists them). `scry` stays off by
# default in Cargo.toml so `cargo install spvirit-tools` and CI need neither
# Npcap nor libpcap; the wheel build supplies them (see release-python.yml).
# The Npcap runtime itself is not bundled (licence): on Windows the scry
# binaries delay-load wpcap.dll and print a warning if it is missing. The
# internal `load` binary (spload) is not in the wheel. No Python ABI is
# involved, so the wheel tags as py3-none-<platform>.
bindings = "bin"
features = ["scry"]
