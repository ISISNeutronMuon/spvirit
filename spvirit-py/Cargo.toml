[package]
name = "spvirit-py"
version.workspace = true
edition = "2024"
description = "Python bindings for spvirit PVAccess client and server."
license = "BSD-3-Clause"
repository = "https://github.com/ISISNeutronMuon/spvirit"
readme = "README.md"
keywords = ["epics", "pvaccess", "python", "pyo3"]
categories = ["science"]
authors = ["Mateusz Leputa for ISIS Neutron and Muon Source Copyright 2026"]

[lib]
name = "spvirit"
# "rlib" is only needed so `cargo test -p spvirit-py --no-default-features
# --features test-embed` can link a standalone test binary against this
# crate's code (see the `[features]` note below); the normal build (via
# maturin) only ever produces/uses the "cdylib".
crate-type = ["cdylib", "rlib"]

[dependencies]
spvirit-types.workspace = true
spvirit-codec.workspace = true
spvirit-client.workspace = true
spvirit-server.workspace = true
# Tier 3. spvirit-ioc depends on spvirit-server and nothing here depends on
# spvirit-py, so this edge introduces no cycle.
spvirit-ioc.workspace = true

pyo3 = { version = "0.24", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "=0.24.0", features = ["tokio-runtime"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde_json = "1.0.145"
tracing = "0.1.41"

[features]
# Default/production build: pyo3's "extension-module" (no libpython linked;
# the hosting `python.exe`/interpreter that `import`s the built `.pyd`/`.so`
# supplies the C API symbols). This is the only feature maturin/`cargo build`
# ever uses.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# Test-only: a handful of `#[cfg(test)]` unit tests need a real, running
# Python interpreter inside the `cargo test` binary itself (e.g. the
# asyncio-bridge race test in `source.rs`), which "extension-module" cannot
# provide (a standalone test executable is not a Python-hosted process).
# Run with:
#   cargo test -p spvirit-py --no-default-features --features test-embed
test-embed = ["pyo3/auto-initialize"]
