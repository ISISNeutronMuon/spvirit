name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release

      - name: Run tests
        run: cargo test --all

      # The docs suite runs above as part of `cargo test --all`; naming it
      # separately makes a documentation drift failure obvious in the log.
      - name: Verify documentation
        run: cargo test -p spvirit-tools --test docs_verify

      - name: Cache mdbook binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-mdbook-0.4-mermaid-0.14

      - name: Install mdbook
        run: |
          which mdbook || cargo install mdbook --version ^0.4 --locked
          which mdbook-mermaid || cargo install mdbook-mermaid --version ^0.14 --locked

      # create-missing = false, so a SUMMARY.md entry with no file fails here.
      - name: Build the book
        run: mdbook build docs/book

  p4p-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install p4p
        run: pip install p4p

      - name: Build workspace binaries
        run: cargo build --all

      - name: Run p4p provider matrix
        env:
          PVA_TEST_P4P: "1"
          P4P_PROVIDER_CMD: "python3 ${{ github.workspace }}/spvirit-tools/tests/interop/p4p_server.py"
          P4P_PROVIDER_READY_MS: "5000"
          P4P_TEST_SERVER: "127.0.0.1:5075"
        run: cargo test --package spvirit-tools --test interop_tool_matrix -- p4p_provider_matrix
