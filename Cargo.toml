[workspace]
members = ["spvirit-types", "spvirit-codec", "spvirit-client", "spvirit-server", "spvirit-tools", "spvirit-py", "spvirit-calc"]
resolver = "2"

# Every member inherits this version with `version.workspace = true`, so a
# release is a one-line bump here. The Python packages depend on these staying
# in step: `spvirit-py/pyproject.toml` pins `spvirit-tools` by exact version,
# and `spvirit-tools/tests/version_pin.rs` fails the build if it drifts.
[workspace.package]
version = "0.1.21"

# Internal crates are declared once so their version is not repeated across
# five manifests. Members refer to them with `workspace = true`.
[workspace.dependencies]
spvirit-types = { version = "0.1.21", path = "spvirit-types" }
spvirit-codec = { version = "0.1.21", path = "spvirit-codec" }
spvirit-client = { version = "0.1.21", path = "spvirit-client" }
spvirit-server = { version = "0.1.21", path = "spvirit-server" }
